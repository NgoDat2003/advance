            note: "Mỗi Cụm chỉ kéo dài 6-9 ngày và xoay quanh đúng 1 chủ đề xuyên suốt; các câu lệnh SQL bạn tự gõ trên DBX ở Pha A chính là câu lệnh sẽ đưa vào Prisma ở Pha B."
