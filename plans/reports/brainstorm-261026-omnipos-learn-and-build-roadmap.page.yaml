            text: "Trọng tâm: K2-05 (gRPC), K2-06 (Microservices & Saga), K3-09 (Transactional Outbox + Debezium CDC + EOS), K3-10 (Fraud Stream) & K3-11..13 (150 câu CCDAK)."
