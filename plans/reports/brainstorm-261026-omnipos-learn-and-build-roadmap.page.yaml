                  - ["Ngày 7 - 9 (24/11 - 26/11)", "Pha B: Dựng Kafka KRaft & Tách Worker đầu tiên", "AI cấu hình sẵn container Kafka KRaft (không ZooKeeper) trong docker-compose.yaml. Bạn tự tay code Producer chuẩn tài chính bắn hóa đơn phân vùng theo storeId/walletId và tách app đầu tiên apps/fraud-worker lắng nghe sự kiện với Cooperative Rebalance."]

