    title: "Đạt cần làm trước khi AI chạy phase 1"
    text: "(1) T1.1: giữ Node 22 bản MSI cho hook của Claude, bỏ C:\\Program Files\\nodejs khỏi PATH cấp Machine (Admin), rồi nvm install 24.22.1, nvm use 24.22.1, corepack enable cho pnpm 11.2.2 (~15 phút; máy dùng nvm for Windows 2.0 chế độ shim). (2) T1.0b: bật Docker Desktop và container của bạn; tạo file checks/guard.local.sh chứa tên container công ty/lab/nhãn khách hàng (file này không commit)."

