  - type: section
    title: "5. Cách Vận Hành '2 Worktree Song Song' Để Bạn Hiểu Sâu Mà Không Bị Đuối Code"
    blocks:
      - type: steps
        title: "Quy Trình 4 Bước Khi Bước Vào Pha B (2 Ngày Cuối Mỗi Cụm)"
        items:
          - title: "Bước 1: AI code và kiểm thử hoàn chỉnh trước trên .worktrees/blueprint"
            text: "Bạn không phải mò mẫm trong bóng tối. AI tạo một nhánh worktree riêng, dựng sẵn toàn bộ phần Vỏ UI React, cấu hình Orval, DTO, Seed data và bản mẫu Core Logic chạy xanh 100% trước."
          - title: "Bước 2: AI copy sẵn phần 'Vỏ UI / CRUD râu ria' sang nhánh chính cho bạn"
            text: "Những file giao diện form, bảng hiển thị, cấu hình râu ria không nằm trong trọng tâm bài học sẽ được AI lắp sẵn sang nhánh của bạn để bạn không tốn thời gian gõ HTML/CSS."
          - title: "Bước 3: Giải phẫu Luồng Đi (Architecture X-Ray) trước khi gõ dòng code đầu tiên"
            text: "AI mở sơ đồ chỉ rõ: Khi bấm nút trên Next.js -> Orval hook gọi endpoint nào -> đi qua Guard/Interceptor nào của NestJS -> xuống Service nào -> gọi Prisma ra sao."
          - title: "Bước 4: Cầm tay chỉ việc từng hàm Core Logic (Bạn hiểu tới đâu code tới đó)"
            text: "Với đúng 1-2 file cốt lõi của Cụm (ví dụ wallet.service.ts và voucher.service.ts ở Cụm 1), AI hướng dẫn bạn viết từng đoạn nhỏ (20-30 dòng), giải thích rõ tại sao phải dùng cú pháp đó và nếu bỏ đi thì bài Stress Test sẽ nổ lỗi gì."

      - type: code
        language: bash
        title: "Cấu Trúc Thư Mục 2 Worktree Song Song Khi Bắt Đầu Pha B Cụm 1 (Ngày 30/10)"
        text: |
          D:/học/advance-be/
          ├── Tài Liệu/                        # Kho slide & Markdown 3 khóa học
          ├── reports/                         # Các bản Teacher Guide HTML từng bài
          └── omnipos-finledger-hub/           # Clone từ NgoDat2003/create-template-project (Nhánh chính của Đạt)
              ├── apps/api/                    # NestJS 10 + Prisma 7 (Bạn học & code Core Logic tại đây)
              ├── apps/web/                    # Next.js 15 + shadcn/ui (AI dựng sẵn Vỏ UI test tải)
              └── .worktrees/
                  └── blueprint/               # Worktree nháp của AI (Chứa bản chuẩn đã test để đối chiếu)

